name: windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm first: setup-node's pnpm cache needs the binary on PATH. No packageManager field in package.json, so pin the
      # major that matches pnpm-lock.yaml (lockfileVersion 9.0).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers (NSIS + MSI)
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ace-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Not gating yet: the Windows test pass is being brought up. Failures show in the log without failing the build.
      - name: Backend unit tests
        working-directory: src-tauri
        run: cargo test --lib
        continue-on-error: true
