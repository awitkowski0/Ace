[package]
name = "atelier"
version = "0.1.0"
edition = "2021"

[lib]
name = "atelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
parking_lot = "0.12.5"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
signal-hook = "0.4.5"
libc = "0.2.190"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-notification = "2.5.1"
ureq = "2"

[profile.release]
lto = true
opt-level = 3
strip = true
panic = "abort"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
